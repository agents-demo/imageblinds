name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure backend URL
        run: |
          BASE="${{ vars.BACKEND_URL }}"
          if [ -z "$BASE" ]; then
            echo "::error::Repository variable BACKEND_URL is not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          sed -i "s|__API_BASE__|$BASE|" static/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - uses: actions/deploy-pages@v4
