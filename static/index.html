<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>ImageBlinds — describe a photo</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#101418" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
</head>
<body>
  <header>
    <h1>
      <svg class="glasses" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="7" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="17" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M2.8 12h5.5M15.7 12h5.5M11.5 12a1.4 1.4 0 0 1 1 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      ImageBlinds
    </h1>
  </header>

  <main id="stage">
    <div id="view-window">
      <video id="camera-view" autoplay playsinline muted></video>
      <img id="photo-img" alt="Frozen photo" hidden />
    </div>

    <section id="cert-banner" class="banner" hidden>
      <p>
        Phone app install needs a trusted certificate.
        <a href="/ca.crt">Download the certificate</a>, then install it via
        Settings → Biometrics and security → Other security settings →
        Install from device storage → CA certificate.
      </p>
    </section>

    <section id="error-panel" class="banner error" hidden aria-live="assertive">
      <p id="error"></p>
    </section>

    <section id="result-overlay" class="overlay" hidden>
      <div class="overlay-backdrop"></div>
      <div class="overlay-content">
        <p id="result" aria-live="polite"></p>
      </div>
    </section>

    <input type="file" id="file-input" accept=".jpg,image/jpeg" hidden />

    <button id="photo-btn" type="button" aria-label="Upload a photo" title="Upload a photo">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="9" cy="10" r="1.8" fill="currentColor" />
        <path d="M4.5 17l4.8-4.6a1.5 1.5 0 0 1 2 0l2.4 2.2M14.5 14.5l2-2a1.5 1.5 0 0 1 2 0l1 1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>

    <button id="shutter-btn" type="button" aria-label="Capture and analyze">
      <span class="shutter-dot"></span>
    </button>
  </main>

  <script src="./assets/config.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
