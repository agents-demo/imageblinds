<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>ImageBlinds — describe a photo</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#101418" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
</head>
<body>
  <header>
    <h1>
      <svg class="glasses" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="7" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="17" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M2.8 12h5.5M15.7 12h5.5M11.5 12a1.4 1.4 0 0 1 1 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      ImageBlinds
    </h1>

    <div id="settings-wrap">
      <button id="settings-btn" type="button" aria-label="Language settings" title="Language settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"
            fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
      </button>

      <div id="settings-panel" hidden role="menu" aria-label="Language">
        <button id="lang-en" type="button" role="menuitemradio" aria-checked="true" aria-label="English" title="English">
          <svg class="flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
            <rect width="24" height="16" fill="#fff" />
            <g fill="#B22234">
              <rect y="0" width="24" height="1.3" />
              <rect y="2.6" width="24" height="1.3" />
              <rect y="5.2" width="24" height="1.3" />
              <rect y="7.8" width="24" height="1.3" />
              <rect y="10.4" width="24" height="1.3" />
              <rect y="13" width="24" height="1.3" />
            </g>
            <rect width="9.6" height="9.1" fill="#3C3B6E" />
            <g fill="#fff">
              <circle cx="1.6" cy="1.5" r="0.45" />
              <circle cx="4.8" cy="1.5" r="0.45" />
              <circle cx="8" cy="1.5" r="0.45" />
              <circle cx="3.2" cy="3.4" r="0.45" />
              <circle cx="6.4" cy="3.4" r="0.45" />
              <circle cx="1.6" cy="5.3" r="0.45" />
              <circle cx="4.8" cy="5.3" r="0.45" />
              <circle cx="8" cy="5.3" r="0.45" />
              <circle cx="3.2" cy="7.2" r="0.45" />
              <circle cx="6.4" cy="7.2" r="0.45" />
            </g>
          </svg>
        </button>
        <button id="lang-zh" type="button" role="menuitemradio" aria-checked="false" aria-label="中文" title="中文">
          <svg class="flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
            <rect width="24" height="16" fill="#DE2910" />
            <g fill="#FFDE00">
              <path d="M5.9 2.1l.55 1.7 1.75-.05-1.4 1.05.5 1.7-1.4-1.05-1.4 1.05.5-1.7-1.4-1.05 1.75.05z" />
              <path d="M10.6 1.3l.28.86.9-.03-.72.53.26.86-.72-.54-.72.54.26-.86-.72-.53.9.03z" transform="rotate(22 10.6 2.6)" />
              <path d="M10.9 3.6l.22.68.71-.03-.57.43.2.68-.57-.43-.57.43.2-.68-.57-.43.71.03z" transform="rotate(40 10.9 4.4)" />
              <path d="M10.6 6.2l.22.68.71-.03-.57.43.2.68-.57-.43-.57.43.2-.68-.57-.43.71.03z" transform="rotate(66 10.6 7)" />
              <path d="M8.9 7.4l.22.68.71-.03-.57.43.2.68-.57-.43-.57.43.2-.68-.57-.43.71.03z" transform="rotate(105 8.9 8.2)" />
            </g>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="stage">
    <div id="view-window">
      <video id="camera-view" autoplay playsinline muted></video>
      <img id="photo-img" alt="Frozen photo" hidden />
    </div>

    <section id="cert-banner" class="banner" hidden>
      <p>
        Phone app install needs a trusted certificate.
        <a href="/ca.crt">Download the certificate</a>, then install it via
        Settings → Biometrics and security → Other security settings →
        Install from device storage → CA certificate.
      </p>
    </section>

    <section id="error-panel" class="banner error" hidden aria-live="assertive">
      <p id="error"></p>
    </section>

    <section id="result-panel" hidden>
      <p id="result" aria-live="polite"></p>
    </section>

    <input type="file" id="file-input" accept=".jpg,image/jpeg" hidden />

    <button id="photo-btn" type="button" aria-label="Upload a photo" title="Upload a photo">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="9" cy="10" r="1.8" fill="currentColor" />
        <path d="M4.5 17l4.8-4.6a1.5 1.5 0 0 1 2 0l2.4 2.2M14.5 14.5l2-2a1.5 1.5 0 0 1 2 0l1 1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>

    <button id="shutter-btn" type="button" aria-label="Capture and analyze">
      <span class="shutter-dot"></span>
    </button>

    <button id="mic-btn" type="button" aria-label="Ask a voice follow-up question" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20M8.5 20h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>
  </main>

  <script src="./assets/config.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
